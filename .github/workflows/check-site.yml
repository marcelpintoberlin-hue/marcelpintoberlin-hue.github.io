name: Check the developer site and app-ads.txt
on:
  workflow_dispatch:
  page_build:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Site and app-ads.txt are public and exact
        run: |
          WANT="google.com, pub-7986683253776459, DIRECT, f08c47fec0942fa0"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o app-ads.txt -w '%{http_code}' https://marcelpintoberlin-hue.github.io/app-ads.txt || true)
            [ "$CODE" = "200" ] && grep -qxF "$WANT" app-ads.txt && break
            echo "HTTP $CODE, waiting for GitHub Pages..."; sleep 30
          done
          echo "HTTP $CODE https://marcelpintoberlin-hue.github.io/app-ads.txt"; cat app-ads.txt
          grep -qxF "$WANT" app-ads.txt
          for u in https://marcelpintoberlin-hue.github.io/ https://marcelpintoberlin-hue.github.io/wonderdoku-privacy/ https://marcelpintoberlin-hue.github.io/wonderdoku-privacy/terms.html; do
            C=$(curl -s -o /dev/null -w '%{http_code}' "$u"); echo "$C $u"; [ "$C" = "200" ]
          done
